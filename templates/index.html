{% extends 'layout.html' %}
{% block content %}
<div class="row g-3">
  <!-- Total -->
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Total Alumnas</h5>
        <p class="display-6">{{ total_students }}</p>
      </div>
    </div>
  </div>

  <!-- Por categoría -->
  <div class="col-md-8">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Alumnas por Categoría</h5>
        <ul class="list-group">
          {% for c in by_category %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
              {{ c._id }}
              <span class="badge bg-primary rounded-pill">{{ c.count }}</span>
            </li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </div>
</div>
{% endblock %}
