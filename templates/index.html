{% extends 'layout.html' %}
{% block content %}
<div class="row g-3">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Total Alumnas</h5>
        <p class="display-6">{{ total_students }}</p>
      </div>
    </div>
  </div>
  <div class="col-md-8">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Accesos Rápidos</h5>
        <form class="row g-2" action="/attendance" method="get">
          <div class="col-md-4">
            <label class="form-label">Categoría</label>
            <select name="category" class="form-select" required>
              <option value="" disabled selected>Elegir…</option>
              {% for c in cats %}
                <option value="{{c}}">{{c}}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Fecha</label>
            <input type="date" class="form-control" name="date" value="{{today}}" required>
          </div>
          <div class="col-md-4 d-flex align-items-end">
            <button class="btn btn-primary w-100" type="submit">Marcar asistencia</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
