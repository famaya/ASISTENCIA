{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Editar Alumna</h2>
    <form method="POST">
        <div class="mb-3">
            <label for="first_name" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="first_name" name="first_name" 
                   value="{{ student.first_name }}" required>
        </div>

        <div class="mb-3">
            <label for="last_name" class="form-label">Apellido</label>
            <input type="text" class="form-control" id="last_name" name="last_name" 
                   value="{{ student.last_name }}" required>
        </div>

        <div class="mb-3">
            <label for="birth_date" class="form-label">Fecha de Nacimiento</label>
            <input type="date" class="form-control" id="birth_date" name="birth_date" 
                   value="{{ student.birth_date|default('') }}" required>
        </div>

        <div class="mb-3">
            <label for="category" class="form-label">Categoría</label>
            <input type="text" class="form-control" id="category" name="category" 
                   value="{{ student.category }}" readonly>
        </div>

        <div class="mb-3">
            <label for="guardian" class="form-label">Apoderado</label>
            <input type="text" class="form-control" id="guardian" name="guardian" 
                   value="{{ student.guardian }}">
        </div>

        <div class="mb-3">
            <label for="phone" class="form-label">Teléfono</label>
            <input type="text" class="form-control" id="phone" name="phone" 
                   value="{{ student.phone }}">
        </div>

        <div class="mb-3">
            <label for="notes" class="form-label">Nota</label>
            <textarea class="form-control" id="notes" name="notes">{{ student.notes }}</textarea>
        </div>

        <div class="mb-3">
            <label for="start_date" class="form-label">Fecha de Ingreso</label>
            <input type="date" class="form-control" id="start_date" name="start_date" 
                   value="{{ student.start_date|default('') }}">
        </div>

        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        <a href="{{ url_for('students.lista_students') }}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

<!-- Script para actualizar categoría automáticamente al cambiar fecha de nacimiento -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const birthDateInput = document.getElementById('birth_date');
    const categoryInput = document.getElementById('category');

    function calcularEdad(fecha) {
        if (!fecha) return 0;
        const birthDate = new Date(fecha);
        const today = new Date();
        let age = today.getFullYear() - birthDate.getFullYear();
        const m = today.getMonth() - birthDate.getMonth();
        if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
            age--;
        }
        return age;
    }

    function actualizarCategoria() {
        const fecha = birthDateInput.value;
        const age = calcularEdad(fecha);

        if (age <= 10) categoryInput.value = 'Sub10';
        else if (age <= 12) categoryInput.value = 'Sub12';
        else if (age <= 14) categoryInput.value = 'Sub14';
        else if (age <= 16) categoryInput.value = 'Sub16';
        else if (age <= 18) categoryInput.value = 'Jóvenes';
        else categoryInput.value = 'Adultos';
    }

    // Actualiza la categoría cuando se cambia la fecha de nacimiento
    birthDateInput.addEventListener('change', actualizarCategoria);

    // También actualizar al cargar la página por si ya tiene fecha
    actualizarCategoria();
});
</script>
{% endblock %}
