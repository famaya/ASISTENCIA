{% extends 'layout.html' %}
{% block content %}
<h4>Registrar pago</h4>
<form action="/payments/save" method="post" class="row g-3" onsubmit="return confirm('¿Confirmar registro de pago?')">
  <input type="hidden" name="student_id" value="{{student_id}}">
  <div class="col-md-4">
    <label class="form-label">Mes</label>
    <input type="month" class="form-control" name="month" value="{{month}}" required>
  </div>
  <div class="col-md-4">
    <label class="form-label">Monto (S/)</label>
    <input type="number" step="0.01" class="form-control" name="amount" value="{{ default_amount }}" required>
  </div>
  <div class="col-md-4">
    <label class="form-label">Método</label>
    <select class="form-select" name="method" required>
      <option value="Efectivo">Efectivo</option>
      <option value="Transferencia">Transferencia</option>
      <option value="Yape/Plin">Yape/Plin</option>
    </select>
  </div>
  <div class="col-12">
    <label class="form-label">Nota</label>
    <input class="form-control" name="note" placeholder="(opcional)">
  </div>
  <div class="col-12 d-flex gap-2">
    <button class="btn btn-primary">Guardar</button>
    <a class="btn btn-secondary" href="/payments">Cancelar</a>
  </div>
</form>
{% endblock %}
