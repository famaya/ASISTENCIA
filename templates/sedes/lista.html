{% extends "base.html" %}

{% block title %}Lista de Sedes{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Sedes</h2>
  <a href="{{ url_for('sedes.agregar_sedes') }}" class="btn btn-primary">+ Agregar Sede</a>
</div>

<table class="table table-striped">
  <thead class="table-dark">
    <tr>
      <th>Direccion</th>
      <th>Costo</th>
     
    </tr>
  </thead>
  <tbody>
    {% for sedes in sedes %}
    <tr>
      <td>{{ sedes.direccion }}</td>
      <td>{{ sedes.costo_horario }}</td>
      
      <td>
        <a href="{{ url_for('sedes.editar_sedes', id=sedes._id) }}" class="btn btn-sm btn-warning">Editar</a>
        <a href="{{ url_for('sedes.eliminar_sedes', id=sedes._id) }}" class="btn btn-danger btn-sm"
   onclick="return confirm('¿Estás seguro de que quieres eliminar a esta sede?');">
   Eliminar
</a>
      </td>
    </tr>
    {% endfor %}
  </tbody>

  
</table>
{% endblock %}m>
