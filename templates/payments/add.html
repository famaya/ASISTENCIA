{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Registrar pago</h2>

  <form method="post">
    <div class="mb-3">
      <label for="student_id" class="form-label">Alumno</label>
      <select name="student_id" id="student_id" class="form-select" required>
        <option value="">-- Selecciona un alumno --</option>
        {% for s in students %}
          <option value="{{ s._id }}" {% if preselect_id == s._id|string %}selected{% endif %}>
            {{ s.first_name }} {{ s.last_name }} 
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label for="amount" class="form-label">Monto</label>
      <input type="number" step="0.01" name="amount" id="amount" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="method" class="form-label">Método</label>
      <select name="method" id="method" class="form-select" required>
        <option value="Efectivo">Efectivo</option>
        <option value="Yape/Plin">Yape/Plin</option>
        <option value="Transferencia">Transferencia</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="note" class="form-label">Nota</label>
      <input type="text" name="note" id="note" class="form-control">
    </div>

    <button type="submit" class="btn btn-primary">Guardar pago</button>
    <a href="{{ url_for('payments.list_payments') }}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
