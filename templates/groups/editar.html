{% extends "base.html" %}

{% block title %}Editar Grupo{% endblock %}

{% block content %}
<h2>Editar Grupo</h2>

<form method="POST" >
  <div class="mb-3">
    <label for="nombre" class="form-label">Nombre del grupo</label>
    <input type="text" class="form-control" name="nombre" value="{{ group.nombre }}" required>
  </div>

  <div class="mb-3">
            <label class="form-label">Profesor</label>
            <select name="profesor_id" class="form-select" required>
                {% for p in profesores %}
                <option value="{{ p._id }}" {% if group.profesor_id == p._id %}selected{% endif %}>
                    {{ p.nombre }}
                </option>
                {% endfor %}
            </select>
  </div>

  <div class="mb-3">
            <label class="form-label">Sede</label>
            <select name="sede_id" class="form-select" required>
                {% for s in sedes %}
                <option value="{{ s._id }}" {% if group.sede_id == s._id %}selected{% endif %}>
                    {{ s.direccion}}
                </option>
                {% endfor %}
            </select>
  </div>
  <div class="mb-3">
            <label class="form-label">Alumnas</label>
            <div class="row">
                {% for a in alumnas %}
                <div class="col-md-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="alumnas" value="{{ a._id }}"
                                 {% if a._id in group.alumnas_ids %}checked{% endif %}>
                        <label class="form-check-label">{{ a.first_name }}</label>
                    </div>
                </div>
                {% endfor %}
            </div>
  </div>

  <button type="submit" class="btn btn-success">Actualizar</button>
  <a href="{{ url_for('groups.lista_grupos') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
