<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Academia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ url_for('index.dashboard') }}">
                 Academia
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">

                    <!-- Gestión -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-people-fill"></i> Gestión
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="{{ url_for('students.lista_students') }}"><i class="bi bi-person-vcard"></i> Estudiantes</a></li>
                            <li><a class="dropdown-item" href="{{ url_for('professors.lista_profesores') }}"><i class="bi bi-person-badge"></i> Profesores</a></li>
                            <li><a class="dropdown-item" href="{{ url_for('sedes.lista_sedes') }}"><i class="bi bi-building"></i> Sedes</a></li>
                            <li><a class="dropdown-item" href="{{ url_for('groups.lista_grupos') }}"><i class="bi bi-people"></i> Grupos</a></li>
                        </ul>
                    </li>

                    <!-- Pagos -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-cash-stack"></i> Pagos
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="{{ url_for('confirmations.list_confirmations') }}"><i class="bi bi-check-circle"></i> Confirmaciones</a></li>
                            <li><a class="dropdown-item" href="{{ url_for('payments.list_payments') }}"><i class="bi bi-wallet2"></i> Estado de pagos</a></li>
                        </ul>
                    </li>
		         
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido dinámico -->
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
